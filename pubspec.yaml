name: claqueta
description: Claqueta - cotiza, agenda y cobra tus producciones audiovisuales.
publish_to: 'none'
# versión visible + número de compilación. Sube el número (+2, +3...) en cada
# APK nueva: así Android la instala ENCIMA de la anterior sin borrar datos.
version: 1.0.3+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.1
  url_launcher: ^6.3.0
  http: ^1.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  google_sign_in: ^7.2.0
  geolocator: ^14.1.2
  supabase_flutter: ^2.18.3
  cloudflare_turnstile: ^3.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ícono de la app (claqueta arena sobre degradado petróleo).
# Se regenera con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono/logo_icono.png"
  # Ícono adaptativo (Android 8+): cada celular lo recorta en su forma.
  adaptive_icon_background: "assets/icono/fondo.png"
  adaptive_icon_foreground: "assets/icono/frente.png"
  # frente.png ya trae su margen (símbolo al 66 % del lienzo, dentro de la
  # zona segura); sin margen extra para que no se vea pequeño.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icono/logo_icono.png"
    background_color: "#0B1315"
    theme_color: "#0B1315"
